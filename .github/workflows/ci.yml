name: CI

# Run unit tests + frontend build on every PR and on pushes to main.
# (Cloud Build only runs on main and also deploys; this gates PRs *before* merge.)
on:
  pull_request:
  push:
    branches: [main]

jobs:
  api-tests:
    name: API unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: movetrack-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: movetrack-api/package-lock.json
      - run: npm ci
      # DB-free unit tests (the integration suites need Postgres and run elsewhere).
      - run: npm run test:unit

  web-build:
    name: Web build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: movetrack-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: movetrack-app/package-lock.json
      - run: npm ci
      - run: npm run build
