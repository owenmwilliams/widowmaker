name: Android

# Unlike iOS (which can't compile in CI without Xcode/macOS signing), Android
# compiles cleanly on a Linux runner — so gate every MoveTrack-Android change on
# a real `assembleDebug` from day one. Path-filtered so unrelated PRs (API, web,
# iOS) don't pay for an Android build.
on:
  pull_request:
    paths:
      - 'MoveTrack-Android/**'
      - '.github/workflows/android.yml'
  push:
    branches: [main]
    paths:
      - 'MoveTrack-Android/**'
      - '.github/workflows/android.yml'

jobs:
  assemble-debug:
    name: assembleDebug
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: MoveTrack-Android
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # SDK 35 platform + build-tools the app pins (compileSdk/targetSdk = 35).
      - name: Install SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('MoveTrack-Android/**/*.gradle.kts', 'MoveTrack-Android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: assembleDebug
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: MoveTrack-Android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
