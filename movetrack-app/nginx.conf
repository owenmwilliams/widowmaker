server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;

    # SPA fallback - serve index.html for all routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # /agent/… is the vendor chat page (#112): the widget's chat variant
    # iframes it on MOVERS' OWN SITES, so the server-level SAMEORIGIN header
    # must not apply here. NOTE nginx add_header inheritance: a block that
    # declares ANY add_header inherits none from the server level, so the
    # other security headers are restated explicitly.
    location /agent/ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        try_files $uri $uri/ /index.html;
    }

    # widget.js has a STABLE URL by design — movers paste the embed line once
    # and we ship updates behind it — so it must never be immutable. Exact
    # location matches beat the regex block below. (NOTE add_header
    # inheritance: restate the security headers.)
    location = /widget.js {
        expires 5m;
        add_header Cache-Control "public, max-age=300, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }

    # Cache static assets (Vite emits content-hashed filenames, so immutable
    # is correct for everything EXCEPT stable-URL files like widget.js above)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
}
