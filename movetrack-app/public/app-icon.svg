      <stop offset="0%" stop-color="#3350A8"></stop>
      <stop offset="55%" stop-color="#233C86"></stop>
      <stop offset="100%" stop-color="#182B62"></stop>
    </linearGradient>
    <linearGradient id="nxRouteWhite" x1="76" y1="84" x2="180" y2="192" gradientUnits="userSpaceOnUse">
