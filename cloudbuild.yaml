# Cloud Build configuration for automated deployments
steps:
  # Run API unit tests (DB-free) — gates the build. Integration suites in
  # movetrack-api/tests/*.test.js require a Postgres instance and are run
  # separately; wire a Cloud SQL/Postgres service in here to include them.
  - name: 'node:18'
    id: 'test-api'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -e
        cd movetrack-api
        npm ci --no-audit --no-fund
        npm run test:unit

  # Build API Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '--no-cache'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/movetrack-repo/movetrack-api:$COMMIT_SHA'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/movetrack-repo/movetrack-api:latest'
      - './movetrack-api'
    id: 'build-api'
    waitFor: ['test-api']

  # Debug secret visibility (optional safety net)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'debug-google-maps-secret'
    entrypoint: 'sh'
    secretEnv: ['GOOGLE_MAPS_BROWSER_KEY']
    args:
      - '-c'
      - |
        if [ -z "$$GOOGLE_MAPS_BROWSER_KEY" ]; then
          echo "ERROR: GOOGLE_MAPS_BROWSER_KEY is NOT set in this debug step"
          exit 1
        else
          echo "DEBUG: GOOGLE_MAPS_BROWSER_KEY is present (value redacted), length=$${#GOOGLE_MAPS_BROWSER_KEY}"
        fi

  # Build Frontend Docker image
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-app'
    entrypoint: 'sh'
    secretEnv: ['GOOGLE_MAPS_BROWSER_KEY']
    args:
      - '-c'
      - |
        echo "Building movetrack-app image..."
        if [ -z "$$GOOGLE_MAPS_BROWSER_KEY" ]; then
          echo "ERROR: GOOGLE_MAPS_BROWSER_KEY is NOT set in this build step"
          exit 1
        else
          echo "GOOGLE_MAPS_BROWSER_KEY is present (value redacted), length=$${#GOOGLE_MAPS_BROWSER_KEY}"
        fi

        docker build \
          --no-cache \
          --build-arg VITE_API_BASE_URL="https://movetrack-api-7hwn7ggbiq-uc.a.run.app" \
          --build-arg VITE_GOOGLE_MAPS_API_KEY="$$GOOGLE_MAPS_BROWSER_KEY" \
          -t "us-central1-docker.pkg.dev/$PROJECT_ID/movetrack-repo/movetrack-app:$COMMIT_SHA" \
          -t "us-central1-docker.pkg.dev/$PROJECT_ID/movetrack-repo/movetrack-app:latest" \
          ./movetrack-app

  # Push API image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/movetrack-repo/movetrack-api:$COMMIT_SHA'
    id: 'push-api'
    waitFor: ['build-api']

  # Push Frontend image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/movetrack-repo/movetrack-app:$COMMIT_SHA'
    id: 'push-app'
    waitFor: ['build-app']

  # Run database migrations via the tracked runner (bin/migrate.js).
  # Fails the build on the first migration error — no more `set +e` swallowing.
  # On the existing production database (no schema_migrations table yet) the runner
  # auto-baselines: it records the current migrations as applied without re-running
  # them, then applies only genuinely new migrations on subsequent deploys.
  - name: 'node:18'
    entrypoint: 'bash'
    secretEnv: ['DB_PASS']
    args:
      - '-c'
      - |
        set -euo pipefail

        # Download + start Cloud SQL Proxy
        curl -sS -o /cloud-sql-proxy https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v2.8.2/cloud-sql-proxy.linux.amd64
        chmod +x /cloud-sql-proxy
        /cloud-sql-proxy --port 5432 $_CLOUD_SQL_CONNECTION &
        PROXY_PID=$$!

        # Wait for the proxy to accept connections
        echo "Waiting for Cloud SQL Proxy..."
        for i in $$(seq 1 30); do
          (echo > /dev/tcp/127.0.0.1/5432) >/dev/null 2>&1 && break
          sleep 1
        done

        cd movetrack-api
        npm install pg@^8 --no-save --no-audit --no-fund

        MT_DATALAYER_HOSTNAME=127.0.0.1 \
        MT_DATALAYER_PORT=5432 \
        MT_DATALAYER_USERNAME=$_DB_USER \
        MT_DATALAYER_PASSWORD=$$DB_PASS \
        MT_DATALAYER_DATABASE=$_DB_NAME \
        node bin/migrate.js

        kill $$PROXY_PID 2>/dev/null || true
        echo "Migrations complete."
    id: 'run-migrations'
    waitFor: ['build-api']

  # Deploy API to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'movetrack-api'
      - '--image'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/movetrack-repo/movetrack-api:$COMMIT_SHA'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--add-cloudsql-instances'
      - '$_CLOUD_SQL_CONNECTION'
      - '--set-env-vars'
      - 'NODE_ENV=production,MT_DATALAYER_HOSTNAME=/cloudsql/$_CLOUD_SQL_CONNECTION,MT_DATALAYER_PORT=5432,MT_DATALAYER_DATABASE=$_DB_NAME,MT_DATALAYER_USERNAME=$_DB_USER,EMAIL_FROM=owen@we3kings.dev,SMTP_HOST=smtp.sendgrid.net,SMTP_PORT=587,SMTP_USER=apikey,VISION_PROVIDER=gemini'
      - '--set-secrets'
      - 'MT_DATALAYER_PASSWORD=movetrack-db-password:latest,JWT_SECRET=movetrack-jwt-secret:latest,SMTP_PASS=sendgrid-api-key:latest,ANTHROPIC_API_KEY=anthropic-key:latest,OPENAI_API_KEY=openai-api-key:latest,GOOGLE_AI_API_KEY=google-ai-key:latest,GOOGLE_MAPS_API_KEY=google-api-key:latest,GOOGLE_API_KEY=google-api-key:latest,GOOGLE_BOOKS_API_KEY=google-api-key:latest,TOGETHER_API_KEY=TOGETHER_API_KEY:latest,HUGGINGFACE_TOKEN=HUGGINGFACE_API_TOKEN:latest,TWELVE_LABS_API_KEY=TWELVE_LABS_API_KEY:latest'
    id: 'deploy-api'
    waitFor: ['push-api', 'run-migrations']

  # Deploy Frontend to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'movetrack-app'
      - '--image'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/movetrack-repo/movetrack-app:$COMMIT_SHA'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
    id: 'deploy-app'
    waitFor: ['push-app', 'deploy-api']

# Store images in Artifact Registry
images:
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/movetrack-repo/movetrack-api:$COMMIT_SHA'
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/movetrack-repo/movetrack-api:latest'
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/movetrack-repo/movetrack-app:$COMMIT_SHA'
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/movetrack-repo/movetrack-app:latest'

# Substitution variables (will be configured in Cloud Build trigger)
substitutions:
  _CLOUD_SQL_CONNECTION: 'widowmaker-477505:us-central1:movetrack-db'
  _DB_NAME: 'movetrack_db'
  _DB_USER: 'movetrack_user'

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'

availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/google-browser-key/versions/latest
      env: 'GOOGLE_MAPS_BROWSER_KEY'
    - versionName: projects/$PROJECT_ID/secrets/movetrack-db-password/versions/latest
      env: 'DB_PASS'
