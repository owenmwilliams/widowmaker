# Cloud Build configuration for automated deployments
steps:
  # Build API Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '--no-cache'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/movetrack-repo/movetrack-api:$COMMIT_SHA'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/movetrack-repo/movetrack-api:latest'
      - './movetrack-api'
    id: 'build-api'

  # Debug secret visibility (optional safety net)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'debug-google-maps-secret'
    entrypoint: 'sh'
    secretEnv: ['GOOGLE_MAPS_API_KEY']
    args:
      - '-c'
      - |
        if [ -z "$$GOOGLE_MAPS_API_KEY" ]; then
          echo "ERROR: GOOGLE_MAPS_API_KEY is NOT set in this debug step"
          exit 1
        else
          echo "DEBUG: GOOGLE_MAPS_API_KEY is present (value redacted), length=$${#GOOGLE_MAPS_API_KEY}"
        fi

  # Build Frontend Docker image
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-app'
    entrypoint: 'sh'
    secretEnv: ['GOOGLE_MAPS_API_KEY']
    args:
      - '-c'
      - |
        echo "Building movetrack-app image..."
        if [ -z "$$GOOGLE_MAPS_API_KEY" ]; then
          echo "ERROR: GOOGLE_MAPS_API_KEY is NOT set in this build step"
          exit 1
        else
          echo "GOOGLE_MAPS_API_KEY is present (value redacted), length=$${#GOOGLE_MAPS_API_KEY}"
        fi

        docker build \
          --no-cache \
          --build-arg VITE_API_BASE_URL="https://movetrack-api-7hwn7ggbiq-uc.a.run.app" \
          --build-arg VITE_GOOGLE_MAPS_API_KEY="$$GOOGLE_MAPS_API_KEY" \
          -t "us-central1-docker.pkg.dev/$PROJECT_ID/movetrack-repo/movetrack-app:$COMMIT_SHA" \
          -t "us-central1-docker.pkg.dev/$PROJECT_ID/movetrack-repo/movetrack-app:latest" \
          ./movetrack-app

  # Push API image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/movetrack-repo/movetrack-api:$COMMIT_SHA'
    id: 'push-api'
    waitFor: ['build-api']

  # Push Frontend image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/movetrack-repo/movetrack-app:$COMMIT_SHA'
    id: 'push-app'
    waitFor: ['build-app']

  # Run database migrations (with Cloud SQL Proxy started in-process)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:alpine'
    entrypoint: sh
    args:
      - '-c'
      - |
        set -euo pipefail
        
        # Install PostgreSQL client and download Cloud SQL Proxy
        apk add --no-cache postgresql-client wget
        wget -q https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v2.8.2/cloud-sql-proxy.linux.amd64 -O /cloud-sql-proxy
        chmod +x /cloud-sql-proxy
        
        # Start Cloud SQL Proxy in background
        /cloud-sql-proxy --port 5432 $_CLOUD_SQL_CONNECTION &
        PROXY_PID=$$!
        
        # Wait for proxy to be ready
        echo "Waiting for Cloud SQL Proxy to start..."
        sleep 10
        
        # Get database password from Secret Manager
        DB_PASS=$$(gcloud secrets versions access latest --secret=movetrack-db-password --project=$PROJECT_ID)
        
        # Run all migration files in order (sorted numerically)
        echo "Running migrations from movetrack-api/migrations/..."
        for file in $$(ls movetrack-api/migrations/*.sql 2>/dev/null | sort -V); do
          echo "Running migration: $$file"
          PGPASSWORD=$$DB_PASS psql -h 127.0.0.1 -U $_DB_USER -d $_DB_NAME -f "$$file" || echo "Warning: $$file may have already been applied"
        done
        
        # Stop the proxy
        kill $$PROXY_PID 2>/dev/null || true
        
        echo "All migrations completed successfully!"
    id: 'run-migrations'
    waitFor: ['build-api']

  # Deploy API to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'movetrack-api'
      - '--image'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/movetrack-repo/movetrack-api:$COMMIT_SHA'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--add-cloudsql-instances'
      - '$_CLOUD_SQL_CONNECTION'
      - '--set-env-vars'
      - 'NODE_ENV=production,MT_DATALAYER_HOSTNAME=/cloudsql/$_CLOUD_SQL_CONNECTION,MT_DATALAYER_PORT=5432,MT_DATALAYER_DATABASE=$_DB_NAME,MT_DATALAYER_USERNAME=$_DB_USER,EMAIL_FROM=owen@we3kings.dev,SMTP_HOST=smtp.sendgrid.net,SMTP_PORT=587,SMTP_USER=apikey,VISION_PROVIDER=gemini'
      - '--set-secrets'
      - 'MT_DATALAYER_PASSWORD=movetrack-db-password:latest,JWT_SECRET=movetrack-jwt-secret:latest,SMTP_PASS=sendgrid-api-key:latest,ANTHROPIC_API_KEY=anthropic-key:latest,OPENAI_API_KEY=openai-api-key:latest,GOOGLE_AI_API_KEY=google-ai-key:latest,GOOGLE_MAPS_API_KEY=GOOGLE_MAPS_API_KEY:latest,TOGETHER_API_KEY=TOGETHER_API_KEY:latest,HUGGINGFACE_TOKEN=HUGGINGFACE_API_TOKEN:latest'
    id: 'deploy-api'
    waitFor: ['push-api', 'run-migrations']

  # Deploy Frontend to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'movetrack-app'
      - '--image'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/movetrack-repo/movetrack-app:$COMMIT_SHA'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
    id: 'deploy-app'
    waitFor: ['push-app', 'deploy-api']

# Store images in Artifact Registry
images:
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/movetrack-repo/movetrack-api:$COMMIT_SHA'
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/movetrack-repo/movetrack-api:latest'
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/movetrack-repo/movetrack-app:$COMMIT_SHA'
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/movetrack-repo/movetrack-app:latest'

# Substitution variables (will be configured in Cloud Build trigger)
substitutions:
  _CLOUD_SQL_CONNECTION: 'widowmaker-477505:us-central1:movetrack-db'
  _DB_NAME: 'movetrack_db'
  _DB_USER: 'movetrack_user'

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'

availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/GOOGLE_MAPS_API_KEY/versions/latest
      env: 'GOOGLE_MAPS_API_KEY'
