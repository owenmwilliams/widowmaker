# Cloud Build configuration for automated deployments
steps:
  # Build API Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/movetrack-repo/movetrack-api:$COMMIT_SHA'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/movetrack-repo/movetrack-api:latest'
      - './movetrack-api'
    id: 'build-api'

  # Build Frontend Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/movetrack-repo/movetrack-app:$COMMIT_SHA'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/movetrack-repo/movetrack-app:latest'
      - './movetrack-app'
    id: 'build-app'

  # Push API image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/movetrack-repo/movetrack-api:$COMMIT_SHA'
    id: 'push-api'
    waitFor: ['build-api']

  # Push Frontend image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/movetrack-repo/movetrack-app:$COMMIT_SHA'
    id: 'push-app'
    waitFor: ['build-app']

  # Run database migrations
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:alpine'
    entrypoint: sh
    args:
      - '-c'
      - |
        # Install PostgreSQL client and Cloud SQL Proxy
        apk add --no-cache postgresql-client wget
        wget https://dl.google.com/cloudsql/cloud_sql_proxy.linux.amd64 -O cloud_sql_proxy
        chmod +x cloud_sql_proxy
        
        # Get database password from Secret Manager
        DB_PASSWORD=$(gcloud secrets versions access latest --secret=movetrack-db-password --project=$PROJECT_ID)
        
        # Run migrations via Cloud SQL Proxy
        (./cloud_sql_proxy -instances=$_CLOUD_SQL_CONNECTION=tcp:5432 &) && sleep 10
        
        # Run safe migration script to add auth tables
        PGPASSWORD=$$DB_PASSWORD psql -h 127.0.0.1 -U $_DB_USER -d $_DB_NAME -f migrations-safe.sql || true
    id: 'run-migrations'
    waitFor: ['build-api']

  # Deploy API to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'movetrack-api'
      - '--image'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/movetrack-repo/movetrack-api:$COMMIT_SHA'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--add-cloudsql-instances'
      - '$_CLOUD_SQL_CONNECTION'
      - '--set-env-vars'
      - 'NODE_ENV=production,MT_DATALAYER_HOSTNAME=/cloudsql/$_CLOUD_SQL_CONNECTION,MT_DATALAYER_PORT=5432,MT_DATALAYER_DATABASE=$_DB_NAME,MT_DATALAYER_USERNAME=$_DB_USER,EMAIL_FROM=owen@we3kings.dev,SMTP_HOST=smtp.sendgrid.net,SMTP_PORT=587,SMTP_USER=apikey,VISION_PROVIDER=gemini'
      - '--set-secrets'
      - 'MT_DATALAYER_PASSWORD=movetrack-db-password:latest,JWT_SECRET=movetrack-jwt-secret:latest,SMTP_PASS=sendgrid-api-key:latest,ANTHROPIC_API_KEY=anthropic-key:latest,OPENAI_API_KEY=openai-api-key:latest,GOOGLE_AI_API_KEY=google-ai-key:latest,GOOGLE_MAPS_API_KEY=GOOGLE_MAPS_API_KEY:latest'
    id: 'deploy-api'
    waitFor: ['push-api', 'run-migrations']

  # Deploy Frontend to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'movetrack-app'
      - '--image'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/movetrack-repo/movetrack-app:$COMMIT_SHA'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
    id: 'deploy-app'
    waitFor: ['push-app', 'deploy-api']

# Store images in Artifact Registry
images:
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/movetrack-repo/movetrack-api:$COMMIT_SHA'
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/movetrack-repo/movetrack-api:latest'
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/movetrack-repo/movetrack-app:$COMMIT_SHA'
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/movetrack-repo/movetrack-app:latest'

# Substitution variables (will be configured in Cloud Build trigger)
substitutions:
  _CLOUD_SQL_CONNECTION: 'widowmaker-477505:us-central1:movetrack-db'
  _DB_NAME: 'movetrack_db'
  _DB_USER: 'movetrack_user'

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'
