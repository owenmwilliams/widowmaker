<!-- @dsCard group="Web Dashboard" viewport="1280x800" name="Web — Inventory dashboard" subtitle="Light, owner-facing overview" -->
<!-- @startingPoint section="Web Dashboard" subtitle="Inventory dashboard overview" viewport="1280x900" -->
<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nexus Moves — Dashboard</title>
<link rel="stylesheet" href="../../styles.css">
<style>
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--l-bg);font-family:var(--font-ui);color:var(--l-text-1)}
  #root{min-height:100vh}
</style>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head><body data-theme="light">
<div id="root"></div>
<script type="text/plain" id="src">
const {useState} = React;
const I=(p)=><svg viewBox="0 0 24 24" width="100%" height="100%" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">{p}</svg>;
const Ic={
  box:<><path d="M21 8l-9-5-9 5 9 5 9-5zM3 8v8l9 5 9-5V8"/></>,
  folder:<><path d="M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2z"/></>,
  pin:<><path d="M12 21s7-6.2 7-11a7 7 0 10-14 0c0 4.8 7 11 7 11z"/><circle cx="12" cy="10" r="2.5"/></>,
  cube:<><path d="M21 8l-9-5-9 5 9 5 9-5zM3 8v8l9 5 9-5V8M12 13v8"/></>,
  scale:<><path d="M12 3v18M5 21h14M6 7h12l3 7a4 4 0 01-8 0M6 7L3 14a4 4 0 008 0"/></>,
  wallet:<><path d="M3 7a2 2 0 012-2h14a2 2 0 012 2v10a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><path d="M16 12h2"/></>,
  alert:<><path d="M10.3 3.9L1.8 18a2 2 0 001.7 3h17a2 2 0 001.7-3L13.7 3.9a2 2 0 00-3.4 0z"/><path d="M12 9v4M12 17h.01"/></>,
  share:<><path d="M12 3v12M8 7l4-4 4 4"/><path d="M5 15v4a2 2 0 002 2h10a2 2 0 002-2v-4"/></>,
  plus:<><path d="M12 5v14M5 12h14"/></>,
  menu:<><path d="M4 6h16M4 12h16M4 18h16"/></>,
};

function StatCard({icon,value,label,sub,tone="accent"}){
  const tones={accent:"var(--accent)",cyan:"var(--cyan-500)",beacon:"var(--beacon-500)",warning:"var(--amber-500)",success:"var(--success)"};
  const c=tones[tone];
  return (
    <div style={{background:"#fff",border:"1px solid var(--l-line)",borderRadius:"var(--r-lg)",padding:22,boxShadow:"var(--shadow-sm)"}}>
      <div style={{display:"flex",alignItems:"center",gap:14}}>
        <span style={{width:44,height:44,borderRadius:"var(--r-md)",background:"color-mix(in oklab, "+c+" 14%, white)",color:c,display:"inline-flex",alignItems:"center",justifyContent:"center"}}><span style={{width:24,height:24}}>{I(icon)}</span></span>
        <span style={{fontSize:34,fontWeight:800,letterSpacing:"-.02em",color:"var(--l-text-1)"}}>{value}</span>
      </div>
      <div style={{fontSize:16,fontWeight:700,marginTop:16}}>{label}</div>
      <div style={{fontSize:13,color:"var(--l-text-3)",marginTop:2}}>{sub}</div>
    </div>
  );
}

function NavTab({children,active,onClick}){return (
  <button onClick={onClick} style={{border:"none",background:active?"#fff":"transparent",color:active?"var(--accent)":"var(--l-text-2)",
    fontFamily:"var(--font-ui)",fontSize:16,fontWeight:700,padding:"9px 18px",borderRadius:"var(--r-md)",cursor:"pointer",
    boxShadow:active?"var(--shadow-xs)":"none"}}>{children}</button>
);}

function App(){
  const [tab,setTab]=useState("Dashboard");
  const [sub,setSub]=useState("Overview");
  const streak=[0,0,281,0,0,247,34];
  const days=["Sat","Sun","Mon","Tue","Wed","Thu","Fri"];
  const max=281;
  const watch=[
    {n:"Unpacked Items",d:"Items not assigned to a container",miss:281,total:281,tone:"var(--danger)"},
    {n:"Missing Photos",d:"Items without any pictures",miss:11,total:281,tone:"var(--success)"},
    {n:"Missing Weight",d:"Items without recorded weight",miss:0,total:281,tone:"var(--success)"},
    {n:"Missing Dimensions",d:"Items without length, width, and height",miss:0,total:281,tone:"var(--success)"},
  ];
  return (
    <div>
      {/* top bar */}
      <div style={{display:"flex",alignItems:"center",gap:26,padding:"14px 28px",background:"#fff",borderBottom:"1px solid var(--l-line)",position:"sticky",top:0,zIndex:5}}>
        <img src="../../assets/logo-lockup-light.svg" height="34" alt="Nexus Moves"/>
        <div style={{display:"flex",gap:4,background:"var(--l-card-2)",padding:5,borderRadius:"var(--r-md)"}}>
          {["Dashboard","Inventory","Move"].map(t=><NavTab key={t} active={tab===t} onClick={()=>setTab(t)}>{t}</NavTab>)}
        </div>
        <div style={{flex:1}}/>
        <button style={{display:"inline-flex",alignItems:"center",gap:9,background:"var(--accent)",color:"#fff",border:"none",borderRadius:"var(--r-md)",padding:"11px 20px",fontSize:15,fontWeight:700,cursor:"pointer"}}><span style={{width:19,height:19}}>{I(Ic.share)}</span>Share with movers</button>
        <button style={{display:"inline-flex",alignItems:"center",gap:9,background:"var(--l-card-2)",color:"var(--l-text-1)",border:"none",borderRadius:"var(--r-md)",padding:"11px 18px",fontSize:15,fontWeight:700,cursor:"pointer"}}><span style={{width:18,height:18}}>{I(Ic.plus)}</span>Add item</button>
        <span style={{width:40,height:40,borderRadius:"var(--r-md)",display:"inline-flex",alignItems:"center",justifyContent:"center",color:"var(--l-text-2)",cursor:"pointer"}}><span style={{width:22,height:22}}>{I(Ic.menu)}</span></span>
      </div>

      <div style={{maxWidth:1240,margin:"0 auto",padding:"26px 28px 60px"}}>
        <div style={{display:"flex",gap:8,marginBottom:26}}>
          {["Overview","Review Attributes","Review Duplicates"].map(t=>(
            <button key={t} onClick={()=>setSub(t)} style={{border:"none",background:sub===t?"#fff":"transparent",color:sub===t?"var(--accent)":"var(--l-text-2)",fontFamily:"var(--font-ui)",fontSize:15,fontWeight:700,padding:"9px 16px",borderRadius:"var(--r-md)",cursor:"pointer",boxShadow:sub===t?"var(--shadow-xs)":"none"}}>{t}</button>
          ))}
        </div>

        <h1 style={{fontFamily:"var(--font-display)",fontSize:40,fontWeight:800,letterSpacing:"-.02em",color:"var(--accent)",margin:"0 0 4px"}}>Dashboard</h1>
        <p style={{color:"var(--l-text-2)",fontSize:16,margin:"0 0 26px"}}>Overview of your inventory</p>

        <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:16,marginBottom:16}}>
          <StatCard icon={Ic.box} value="281" label="Items" sub="Total inventory items"/>
          <StatCard icon={Ic.box} value="0" label="Containers" sub="Boxes and containers" tone="cyan"/>
          <StatCard icon={Ic.folder} value="14" label="Collections" sub="Organizational groups" tone="cyan"/>
          <StatCard icon={Ic.pin} value="2" label="Locations" sub="Physical addresses" tone="success"/>
        </div>
        <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:16,marginBottom:28}}>
          <StatCard icon={Ic.wallet} value="$0" label="Total Value" sub="Estimated inventory value" tone="beacon"/>
          <StatCard icon={Ic.scale} value="6,098 lbs" label="Total Weight" sub="281/281 items tracked" tone="cyan"/>
          <StatCard icon={Ic.cube} value="1,312 cu ft" label="Total Volume" sub="281/281 items tracked" tone="accent"/>
          <StatCard icon={Ic.alert} value="99" label="Fragile Items" sub="Handle with care" tone="warning"/>
        </div>

        <div style={{display:"grid",gridTemplateColumns:"1fr 1.2fr",gap:20}}>
          {/* streak */}
          <div style={{background:"#fff",border:"1px solid var(--l-line)",borderRadius:"var(--r-lg)",padding:24,boxShadow:"var(--shadow-sm)"}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
              <div><div style={{fontFamily:"var(--font-display)",fontSize:24,fontWeight:800,color:"var(--accent)"}}>Packing Streak</div>
              <div style={{color:"var(--l-text-2)",fontSize:14,marginTop:2}}>Items added in the last 7 days</div></div>
              <span style={{fontFamily:"var(--font-mono)",fontSize:13,fontWeight:600,color:"var(--accent)",border:"1px solid var(--accent-quiet-2)",borderRadius:"var(--r-pill)",padding:"4px 12px"}}>281 this week</span>
            </div>
            <div style={{display:"flex",alignItems:"flex-end",gap:14,height:200,marginTop:24}}>
              {streak.map((v,i)=>(
                <div key={i} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:8,height:"100%",justifyContent:"flex-end"}}>
                  {v>0&&<span style={{fontSize:13,fontWeight:700,color:"var(--l-text-1)"}}>{v}</span>}
                  <div style={{width:"100%",height:v>0?(20+(v/max)*140)+"px":"8px",borderRadius:"10px",background:v>0?"var(--shimmer-v)":"var(--l-card-2)"}}/>
                  <span style={{fontSize:12,color:"var(--l-text-3)"}}>{days[i]}</span>
                </div>
              ))}
            </div>
          </div>
          {/* watchlist */}
          <div style={{background:"#fff",border:"1px solid var(--l-line)",borderRadius:"var(--r-lg)",padding:24,boxShadow:"var(--shadow-sm)"}}>
            <div style={{fontFamily:"var(--font-display)",fontSize:24,fontWeight:800,color:"var(--accent)",marginBottom:6}}>Data Quality Watchlist</div>
            <div style={{display:"flex",justifyContent:"space-between",fontSize:13,fontWeight:700,color:"var(--l-text-2)",padding:"10px 0 6px",borderBottom:"1px solid var(--l-line)"}}>
              <span>Attribute</span><span style={{display:"flex",gap:40}}><span>Missing</span><span>Total</span></span>
            </div>
            {watch.map((w,i)=>(
              <div key={i} style={{padding:"14px 0",borderBottom:i<watch.length-1?"1px solid var(--l-line-soft)":"none"}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
                  <div><div style={{fontSize:15,fontWeight:700}}>{w.n}</div><div style={{fontSize:13,color:"var(--l-text-3)",marginTop:1}}>{w.d}</div></div>
                  <div style={{display:"flex",gap:44,alignItems:"baseline"}}><span style={{fontSize:16,fontWeight:800,color:w.miss>0?"var(--l-text-1)":"var(--l-text-3)"}}>{w.miss}</span><span style={{fontSize:16,color:"var(--l-text-3)"}}>{w.total}</span></div>
                </div>
                <div style={{height:6,borderRadius:"999px",background:"var(--l-card-2)",overflow:"hidden",marginTop:10}}>
                  <div style={{width:(w.miss/w.total*100)+"%",height:"100%",background:w.tone,borderRadius:"999px"}}/>
                </div>
              </div>
            ))}
          </div>
        </div>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
<script>(function(){var c=document.getElementById("src").textContent;(0,eval)(Babel.transform(c,{presets:[["react",{runtime:"classic"}]],plugins:[]}).code);})();</script>
</body></html>
