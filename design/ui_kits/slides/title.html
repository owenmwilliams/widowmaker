<!-- @dsCard group="Slides" viewport="1280x720" name="Slide — Title" subtitle="Aurora hero title slide" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>
  html,body{margin:0}
  .slide{width:1280px;height:720px;background:var(--d-bg);position:relative;overflow:hidden;font-family:var(--font-ui);color:var(--d-text-1)}
  .aurora{position:absolute;inset:0;background:var(--aurora)}
  .inner{position:relative;height:100%;display:flex;flex-direction:column;justify-content:center;padding:0 96px}
  .eyebrow{font-family:var(--font-mono);font-size:16px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--shimmer-cyan)}
  h1{font-family:var(--font-display);font-size:104px;font-weight:800;letter-spacing:-.03em;line-height:.98;margin:24px 0 0}
  p{font-size:26px;color:var(--d-text-2);max-width:720px;margin:28px 0 0;line-height:1.4}
</style></head><body>
<div class="slide">
  <div class="aurora"></div>
  <div class="inner">
    <img src="../../assets/logo-lockup-dark.svg" height="40" alt="Nexus Moves" style="align-self:flex-start;margin-bottom:56px">
    <span class="eyebrow">Your AI moving assistant</span>
    <h1>Almost home.</h1>
    <p>The agentic moving companion that turns a stressful move into a calm, guided, quote-ready inventory.</p>
  </div>
</div>
</body></html>
