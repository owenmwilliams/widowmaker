<!-- @dsCard group="Slides" viewport="1280x720" name="Slide — Big stat" subtitle="Shimmer metric moment" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>
  html,body{margin:0}
  .slide{width:1280px;height:720px;background:var(--d-bg);font-family:var(--font-ui);color:var(--d-text-1);display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:0 96px;box-sizing:border-box}
  .eyebrow{font-family:var(--font-mono);font-size:16px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--d-text-3)}
  .stat{font-family:var(--font-display);font-size:200px;font-weight:800;letter-spacing:-.04em;line-height:1;margin:18px 0 10px;background:var(--shimmer);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  p{font-size:26px;color:var(--d-text-2);max-width:640px;margin:0;line-height:1.4}
</style></head><body>
<div class="slide">
  <span class="eyebrow">The average 3-bedroom move</span>
  <div class="stat">8,000<span style="font-size:80px"> lbs</span></div>
  <p>Nexus captures it in minutes of chat — so movers quote on reality, not a phone-call guess.</p>
</div>
</body></html>
