<!-- @dsCard group="Slides" viewport="1280x720" name="Slide — Section divider" subtitle="Numbered section break" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>
  html,body{margin:0}
  .slide{width:1280px;height:720px;background:var(--navy-800);position:relative;overflow:hidden;font-family:var(--font-ui);color:#fff}
  .aurora{position:absolute;inset:0;background:var(--aurora)}
  .inner{position:relative;height:100%;display:flex;flex-direction:column;justify-content:center;padding:0 96px}
  .num{font-family:var(--font-mono);font-size:26px;font-weight:600;color:var(--shimmer-cyan)}
  h1{font-family:var(--font-display);font-size:88px;font-weight:800;letter-spacing:-.03em;line-height:1;margin:16px 0 0}
  .rule{width:120px;height:6px;border-radius:3px;background:var(--shimmer);margin-top:36px}
</style></head><body>
<div class="slide">
  <div class="aurora"></div>
  <div class="inner">
    <span class="num">02 — The experience</span>
    <h1>Cataloging,<br>by conversation.</h1>
    <div class="rule"></div>
  </div>
</div>
</body></html>
