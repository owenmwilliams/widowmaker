<script type="text/plain" id="src">
const {useState, useRef, useEffect} = React;
const I = (p, w=24) => <svg viewBox="0 0 24 24" width="100%" height="100%" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">{p}</svg>;
const Ic = {

  plus: <><path d="M12 5v14M5 12h14"/></>,

  dots: <><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></>,
  chev: <><path d="M9 6l6 6-6 6"/></>,
  edit: <><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/></>,
  send: <><path d="M22 2L11 13M22 2l-7 20-4-9-9-4z"/></>,

// ---- inline DS primitives (cosmetic versions of the bundled components) ----
function Avatar({size=44}){return (
  <span style={{display:"inline-flex",alignItems:"center",justifyContent:"center",width:size,height:size,flex:"none",borderRadius:"var(--r-md)",background:"var(--shimmer)",position:"relative",overflow:"hidden",boxShadow:"var(--glow-shimmer)"}}>

    <svg width={size*0.5} height={size*0.5} viewBox="0 0 24 24" style={{position:"relative"}}>
      <path d="M12 3l1.7 4.6L18 9.2l-4.3 1.6L12 15.4l-1.7-4.6L6 9.2l4.3-1.6z" fill="#fff"/>
      <path d="M18.5 14l.9 2.2 2.1.9-2.1.9-.9 2.2-.9-2.2-2.1-.9 2.1-.9z" fill="#fff"/>
    </svg>
  </span>
);}
function Bubble({from,shimmer,children}){const self=from==="self";return (
  <div style={{maxWidth:"82%",alignSelf:self?"flex-end":"flex-start",position:"relative",overflow:"hidden",
    background:self?(shimmer?"var(--shimmer)":"var(--bubble-self)"):"var(--bubble-other)",
    color:self?"#fff":"var(--d-text-1)",padding:"13px 17px",borderRadius:"var(--r-xl)",
    borderBottomRightRadius:self?7:"var(--r-xl)",borderBottomLeftRadius:self?"var(--r-xl)":7,
    fontSize:17,lineHeight:1.45,fontWeight:self?600:400,whiteSpace:"pre-wrap"}}>
    {self&&shimmer&&<span style={{position:"absolute",inset:0,width:"45%",background:"linear-gradient(90deg,transparent,rgba(255,255,255,.32),transparent)",animation:"nx-shimmer-sweep var(--shimmer-sweep) var(--ease-standard) infinite"}}/>}
    <span style={{position:"relative"}}>{children}</span>
  </div>
);}
function Suggestion({icon,children,onClick}){const[h,setH]=useState(false);return (
  <button onClick={onClick} onMouseEnter={()=>setH(1)} onMouseLeave={()=>setH(0)}
    style={{display:"flex",alignItems:"center",gap:12,width:"100%",padding:"16px 18px",borderRadius:"var(--r-lg)",
    fontFamily:"var(--font-ui)",fontSize:17,fontWeight:700,letterSpacing:"-.01em",color:"var(--accent)",textAlign:"left",
    background:h?"var(--accent-quiet-2)":"var(--accent-quiet)",border:"none",cursor:"pointer"}}>
    <span style={{width:20,height:20,flex:"none",display:"inline-flex"}}>{I(icon)}</span>{children}
  </button>
);}
function StatusPill({children}){return (
  <span style={{alignSelf:"center",display:"inline-flex",alignItems:"center",gap:8,padding:"8px 16px",background:"var(--d-card)",borderRadius:"var(--r-pill)",fontSize:14,fontWeight:700,color:"var(--success)"}}>
    <span style={{width:18,height:18,borderRadius:"999px",border:"1.5px solid var(--success)",display:"inline-flex",padding:2}}>{I(Ic.check)}</span>{children}
  </span>
);}

function StatusBar(){return (
  <div style={{height:54,display:"flex",alignItems:"flex-end",justifyContent:"space-between",padding:"0 28px 8px",color:"#fff",flex:"none"}}>
    <span style={{fontSize:16,fontWeight:600}}>9:21</span>
    <span style={{display:"inline-flex",gap:6,alignItems:"center"}}>
      <svg width="18" height="12" viewBox="0 0 18 12"><rect x="0" y="7" width="3" height="5" rx="1" fill="#fff"/><rect x="5" y="4" width="3" height="8" rx="1" fill="#fff"/><rect x="10" y="1.5" width="3" height="10.5" rx="1" fill="#fff"/><rect x="15" y="0" width="3" height="12" rx="1" fill="#fff" opacity=".4"/></svg>
      <svg width="17" height="12" viewBox="0 0 17 12" fill="none"><path d="M8.5 3.5c2 0 3.8.8 5.2 2.1l1.5-1.6A9.4 9.4 0 008.5 1 9.4 9.4 0 001.8 4l1.5 1.6A7.4 7.4 0 018.5 3.5z" fill="#fff"/><path d="M8.5 7c1 0 1.9.4 2.6 1.1l-2.6 2.8-2.6-2.8A3.7 3.7 0 018.5 7z" fill="#fff"/></svg>
      <span style={{display:"inline-flex",alignItems:"center"}}><span style={{width:24,height:12,border:"1.5px solid rgba(255,255,255,.5)",borderRadius:3,display:"inline-flex",alignItems:"center",padding:1}}><span style={{width:"85%",height:"100%",background:"#fff",borderRadius:1}}/></span></span>
    </span>
  </div>
);}

function Header({pct, onShare}){return (
  <div style={{flex:"none",padding:"4px 18px 16px",background:"var(--d-surface-1)",borderBottom:"1px solid var(--d-line-soft)"}}>
    <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:14}}>
      <Avatar size={44}/>
      <div style={{flex:1}}>
        <div style={{fontSize:22,fontWeight:800,letterSpacing:"-.01em",color:"var(--d-text-1)"}}>Nexus Moves</div>
        <div style={{fontSize:14,color:"var(--d-text-2)",fontWeight:600,marginTop:-1}}>Your moving assistant</div>
      </div>
      <span style={{width:34,height:34,borderRadius:"999px",border:"1.5px solid var(--accent-quiet-2)",display:"inline-flex",alignItems:"center",justifyContent:"center",color:"var(--accent)"}}><span style={{width:18,height:18}}>{I(Ic.dots)}</span></span>
    </div>
    <div style={{background:"#000",borderRadius:"var(--r-xl)",padding:"16px 16px",display:"flex",alignItems:"center",gap:14}}>
      <div style={{flex:1}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"baseline"}}>
          <span style={{fontSize:19,fontWeight:800,color:"#fff",letterSpacing:"-.01em"}}>{pct>=94?"Ready to share":"Building your inventory"}</span>
          <span style={{fontFamily:"var(--font-mono)",fontSize:15,fontWeight:600,color:"var(--d-text-2)"}}>{pct}%</span>
        </div>
        <div style={{height:9,borderRadius:"999px",background:"#2a2a30",overflow:"hidden",margin:"12px 0 10px"}}>
          <div style={{width:pct+"%",height:"100%",background:"var(--shimmer)",borderRadius:"999px",position:"relative",overflow:"hidden"}}>
            {pct>0&&pct<100&&<span style={{position:"absolute",inset:0,width:"40%",background:"linear-gradient(90deg,transparent,rgba(255,255,255,.5),transparent)",animation:"nx-shimmer-sweep var(--shimmer-sweep) var(--ease-standard) infinite"}}/>}
          </div>
        </div>
        <span style={{display:"inline-flex",alignItems:"center",gap:4,color:"var(--accent)",fontSize:15,fontWeight:700}}>See what's left <span style={{width:15,height:15,display:"inline-flex"}}>{I(Ic.chev)}</span></span>
      </div>
      <button onClick={onShare} style={{width:92,alignSelf:"stretch",background:"var(--accent)",border:"none",borderRadius:"var(--r-md)",color:"#fff",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:5,cursor:"pointer",padding:"12px 0"}}>
        <span style={{width:22,height:22}}>{I(Ic.share)}</span><span style={{fontSize:16,fontWeight:700}}>Share</span>
      </button>
    </div>
  </div>
);}

function Composer(){return (
  <div style={{flex:"none",padding:"10px 14px 30px",background:"var(--d-bg)",display:"flex",alignItems:"center",gap:10}}>
    <span style={{width:44,height:44,borderRadius:"999px",background:"var(--accent)",display:"inline-flex",alignItems:"center",justifyContent:"center",color:"#fff",flex:"none",cursor:"pointer"}}><span style={{width:20,height:20}}>{I(Ic.plus)}</span></span>
    <div style={{flex:1,height:48,background:"var(--d-card)",borderRadius:"var(--r-pill)",display:"flex",alignItems:"center",padding:"0 18px",color:"var(--d-text-3)",fontSize:17}}>Message Nexus…</div>
    <span style={{width:44,height:44,borderRadius:"999px",background:"var(--d-card-2)",display:"inline-flex",alignItems:"center",justifyContent:"center",color:"var(--d-text-2)",flex:"none",cursor:"pointer"}}><span style={{width:20,height:20}}>{I(Ic.up)}</span></span>
  </div>
);}

function ShareSheet({onClose}){return (
  <div style={{position:"absolute",inset:0,zIndex:20,display:"flex",flexDirection:"column",justifyContent:"flex-end"}}>
    <div onClick={onClose} style={{position:"absolute",inset:0,background:"rgba(0,0,0,.55)",backdropFilter:"blur(2px)"}}/>
    <div style={{position:"relative",background:"var(--d-surface-2)",borderTopLeftRadius:"var(--r-2xl)",borderTopRightRadius:"var(--r-2xl)",maxHeight:"90%",overflowY:"auto",animation:"nx-up .34s var(--ease-standard)"}}>
      <div style={{display:"flex",justifyContent:"center",padding:"10px 0 0"}}><span style={{width:40,height:5,borderRadius:"999px",background:"var(--d-line)"}}/></div>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"12px 20px 4px"}}>
        <span style={{fontSize:18,fontWeight:700,color:"#fff"}}>Get ready to share</span>
        <button onClick={onClose} style={{border:"none",background:"var(--d-card)",color:"#fff",fontSize:16,fontWeight:600,padding:"8px 18px",borderRadius:"var(--r-pill)",cursor:"pointer"}}>Done</button>
      </div>
      <div style={{padding:"18px 20px 28px"}}>
        <div style={{textAlign:"center"}}>
          <div style={{fontSize:34,fontWeight:800,color:"#fff",letterSpacing:"-.02em"}}>In progress</div>
          <div style={{fontSize:17,color:"var(--d-text-2)",marginTop:6}}>13 items across 9 rooms. 43 lbs, ~6 cu ft.</div>
        </div>
        <div style={{display:"flex",gap:12,alignItems:"flex-start",background:"var(--amber-cream)",borderRadius:"var(--r-lg)",padding:"15px 17px",margin:"20px 0",color:"var(--amber-ink)",fontSize:16,lineHeight:1.42,fontWeight:500}}>
          <span style={{width:22,height:22,flex:"none",color:"var(--amber-500)",marginTop:1}}><svg viewBox="0 0 24 24" width="100%" height="100%" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"><path d="M10.3 3.9L1.8 18a2 2 0 001.7 3h17a2 2 0 001.7-3L13.7 3.9a2 2 0 00-3.4 0z"/><path d="M12 9v4M12 17h.01"/></svg></span>
          Only ~43 lbs logged for a 3-bedroom home, which usually totals around 8,000 lbs. You've likely missed rooms or items — worth a second pass before sharing.
        </div>
        <div style={{background:"var(--d-card)",borderRadius:"var(--r-lg)",padding:"16px 18px",marginBottom:16}}>
          <div style={{fontSize:18,fontWeight:800,color:"#fff",marginBottom:6}}>Next steps</div>
          {["Catalog items in empty rooms: Bedroom 3, Bedroom 2, Living Room","Keep adding items — 13 logged so far, most moves have 50+"].map((t,i)=>(
            <div key={i} style={{display:"flex",gap:14,alignItems:"flex-start",padding:"10px 0"}}>
              <span style={{width:24,height:24,flex:"none",borderRadius:"999px",border:"2px solid var(--accent)",marginTop:1}}/>
              <span style={{fontSize:17,lineHeight:1.4,fontWeight:500,color:"#fff"}}>{t}</span>
            </div>
          ))}
        </div>
        <div style={{background:"var(--d-card)",borderRadius:"var(--r-lg)",padding:"16px 18px",marginBottom:22}}>
          <div style={{fontSize:18,fontWeight:800,color:"#fff",marginBottom:8}}>Videos &amp; photos</div>
          <div style={{display:"flex",gap:12,alignItems:"flex-start",color:"var(--success)",fontSize:16,lineHeight:1.4,fontWeight:600}}>
            <span style={{width:22,height:22,flex:"none"}}><svg viewBox="0 0 24 24" width="100%" height="100%" fill="var(--success)"><path d="M12 2l2.4 1.8 3-.2 1 2.8 2.6 1.5-.8 2.9.8 2.9-2.6 1.5-1 2.8-3-.2L12 22l-2.4-1.8-3 .2-1-2.8L3 16.3l.8-2.9L3 10.5l2.6-1.5 1-2.8 3 .2z"/><path d="M8.5 12.5l2.4 2.4 4.6-4.8" fill="none" stroke="#0B0B0F" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/></svg></span>
            Every room has a walkthrough and the big items are photographed.
          </div>
        </div>
        <button style={{width:"100%",height:56,border:"none",borderRadius:"var(--r-lg)",background:"var(--shimmer)",color:"#fff",fontSize:18,fontWeight:800,display:"flex",alignItems:"center",justifyContent:"center",gap:10,cursor:"pointer",position:"relative",overflow:"hidden"}}>
          <span style={{position:"absolute",inset:0,width:"45%",background:"linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent)",animation:"nx-shimmer-sweep var(--shimmer-sweep) var(--ease-standard) infinite"}}/>
          <span style={{width:22,height:22,position:"relative"}}>{I(Ic.share)}</span><span style={{position:"relative"}}>Share inventory</span>
        </button>
        <div style={{display:"flex",gap:12,marginTop:12}}>
          <button style={{flex:1,height:52,border:"none",borderRadius:"var(--r-md)",background:"var(--accent-quiet)",color:"var(--accent)",fontSize:17,fontWeight:700,cursor:"pointer"}}>Estimate weights</button>
          <button style={{flex:1,height:52,border:"none",borderRadius:"var(--r-md)",background:"var(--accent-quiet)",color:"var(--accent)",fontSize:17,fontWeight:700,cursor:"pointer"}}>Add a room</button>
        </div>
      </div>
    </div>
  </div>
);}

function App(){
  const [msgs,setMsgs]=useState([
    {from:"assistant",text:"Great, those 7 items are added!\n\nI checked for duplicates in your Unsorted items, and we're all clear there.\n\nWhat else should we add to the Hallway, Owen? Or would you prefer to move on and catalog another room, like Storage?"},
  ]);
  const [showSug,setShowSug]=useState(true);
  const [sheet,setSheet]=useState(false);
  const [pct,setPct]=useState(94);
  const scroller=useRef(null);
  useEffect(()=>{if(scroller.current)scroller.current.scrollTop=scroller.current.scrollHeight;},[msgs]);
  function pick(label){
    setShowSug(false);
    setMsgs(m=>[...m,{from:"self",text:label}]);
    setTimeout(()=>setMsgs(m=>[...m,{status:"Items reviewed · 8 added"}]),350);
    setTimeout(()=>setMsgs(m=>[...m,{from:"self",shimmer:true,text:"Added 8 of the 10 items from the Everything In This Closet scan."}]),700);
  }
  return (
    <div style={{height:"100%",display:"flex",flexDirection:"column",background:"var(--d-bg)"}}>
      <StatusBar/>
      <Header pct={pct} onShare={()=>setSheet(true)}/>
      <div ref={scroller} style={{flex:1,overflowY:"auto",padding:"18px 16px",display:"flex",flexDirection:"column",gap:12}}>
        {msgs.map((m,i)=> m.status
          ? <StatusPill key={i}>{m.status}</StatusPill>
          : <Bubble key={i} from={m.from} shimmer={m.shimmer}>{m.text}</Bubble>)}
        {showSug && <>
          <Suggestion icon={Ic.edit} onClick={()=>pick("Everything in this closet")}>Catalog more Hallway items</Suggestion>
          <Suggestion icon={Ic.send} onClick={()=>pick("Catalog Storage")}>Catalog Storage</Suggestion>
        </>}
      </div>
      <Composer/>
      {sheet && <ShareSheet onClose={()=>setSheet(false)}/>}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>

<script>
(async () => {
  if (!document.title || !document.title.trim()) document.title = "index";
  // Prepend so page-supplied @page / break rules (deck-stage's margin:0,
  // author CSS) keep source-order precedence over the baseline.
  const baseCss = document.createElement('style');
  baseCss.textContent = "@media print {\n  figure, table { break-inside: avoid; }\n  *, *::before, *::after {\n    print-color-adjust: exact; -webkit-print-color-adjust: exact;\n    backdrop-filter: none !important; -webkit-backdrop-filter: none !important;\n    animation-delay: -99s !important; animation-duration: .001s !important;\n    animation-iteration-count: 1 !important; animation-fill-mode: both !important;\n    animation-play-state: running !important; transition-duration: 0s !important;\n  }\n}";
  document.head.prepend(baseCss);
  if (document.readyState === 'loading') {
    await new Promise((r) => document.addEventListener('DOMContentLoaded', r, { once: true }));
  }
  let ds = document.querySelector('deck-stage');
  // whenDefined never resolves when nothing registers the element, so only
  // await it when a <deck-stage> tag exists (and race a timeout regardless).
  if (ds && !customElements.get('deck-stage')) {
    try {
      await Promise.race([
        customElements.whenDefined('deck-stage'),
        new Promise((r) => setTimeout(r, 3000)),
      ]);
    } catch (e) {}
    ds = document.querySelector('deck-stage');
  }
  // dc-runtime assigns window.DCLogic at init and mounts into #dc-root on
  // DOMContentLoaded; settle on that subtree so React has rendered before
  // print(). Non-DC pages fall through to weighing body.
  const isDc = !ds && 'DCLogic' in window;
  const settleRoot = ds || (isDc ? document.getElementById('dc-root') : null) || document.body;
  if (settleRoot) {
    // Weigh only content children — skip script/style/template so inline
    // Babel/CSS doesn't register as stable "content" before the framework
    // has mounted anything.
    const MEDIA = 'img,svg,canvas,video,picture,iframe,embed,object';
    const weigh = () => {
      let text = 0, media = 0;
      for (const c of settleRoot.children) {
        const t = c.tagName;
        if (t === 'SCRIPT' || t === 'STYLE' || t === 'TEMPLATE') continue;
        text += (c.textContent || '').trim().length;
        media += c.querySelectorAll(MEDIA).length + (c.matches(MEDIA) ? 1 : 0);
      }
      return text + media * 100;
    };
    // "Non-zero and stable" alone is not sufficient to mean rendered: generic
    // body can carry a static shell while async main content is pending, and
    // #dc-root can carry the root DC's static text while child refs are still
    // .sc-placeholder boxes. Gate generic on readyState 'complete', and never
    // accept stability while a dc-runtime placeholder is present.
    const isGeneric = settleRoot === document.body;
    const deadline = Date.now() + 15000;
    let last = -1, stable = 0;
    while (Date.now() < deadline) {
      const n = weigh();
      const ready =
        (!isGeneric || document.readyState === 'complete') &&
        !settleRoot.querySelector('.sc-placeholder');
      if (n > 0 && n === last && ready) { if (++stable >= 2) break; } else { stable = 0; }
      last = n;
      await new Promise((r) => setTimeout(r, 250));
    }
  }
  // Project support.js may predate runtime default-seeding; push via bridge.
  if (isDc && window.__dcSetProps && window.__dcRootName) {
    try {
      const dpEl = document.querySelector('script[data-dc-script]');
      const meta = JSON.parse((dpEl && dpEl.getAttribute('data-props')) || '{}');
      const bag = {};
      for (const k in meta)
        if (k[0] !== '$' && meta[k] && meta[k].default !== undefined)
          bag[k] = meta[k].default;
      if (Object.keys(bag).length) {
        window.__dcSetProps(window.__dcRootName(), bag);
        await new Promise((r) => setTimeout(r, 50));
      }
    } catch (e) {}
  }
  // Reveal content gated on scroll or visibility before printing. Lazy <img>,
  // IntersectionObserver fade-ins, and collapsed <details> don't render while
  // off-screen, so a long page would print with them blank or closed. Open
  // every <details>, force native-lazy images eager, and scroll the document
  // through its full height to trip lazy-load + IO; then wait (bounded) for the
  // newly-triggered images. Inert for deck-stage (slides aren't scroll-gated).
  try {
    for (const d of document.querySelectorAll('details')) d.open = true;
    for (const img of document.querySelectorAll('img[loading="lazy"]'))
      img.loading = 'eager';
    const scroller = document.scrollingElement || document.documentElement;
    const full = Math.max(scroller.scrollHeight, document.body.scrollHeight);
    const step = window.innerHeight || 800;
    for (let y = 0; y <= full; y += step) {
      window.scrollTo(0, y);
      await new Promise((r) => requestAnimationFrame(r));
    }
    window.scrollTo(0, 0);
    await Promise.race([
      Promise.all(
        [...document.images].map((img) =>
          img.complete
            ? null
            : new Promise((res) => {
                img.addEventListener('load', res, { once: true });
                img.addEventListener('error', res, { once: true });
              })
        )
      ),
      new Promise((r) => setTimeout(r, 4000)),
    ]);
  } catch (e) {}
  try { await document.fonts.ready; } catch (e) {}
  // Jump every animation to its end state so print() never captures a slide
  // mid-entrance. Ordering matters: the 0s-transition style must be live
  // BEFORE data-deck-active is set so attribute-keyed transitions don't
