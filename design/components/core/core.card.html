<!-- @dsCard group="Components" viewport="700x340" name="Buttons, Icon Buttons, Badges, Chips" subtitle="Core actions & tokens" -->
<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body{margin:0;background:var(--bg);font-family:var(--font-ui);padding:22px;color:var(--text-primary)}
  .grp{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:16px}
  .lbl{font-family:var(--font-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-tertiary);width:100%;margin-bottom:2px}
</style>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="../../_ds_bundle.js"></script>
</head><body>
<div id="root"></div>
<script type="text/plain" id="src">
  function findComp(name){ if(typeof window[name]==="function")return window[name];
    for(const k in window){try{const v=window[k];if(v&&typeof v==="object"&&v[name])return v[name];}catch(e){}} return null; }
  const Button=findComp("Button"), IconButton=findComp("IconButton"), Badge=findComp("Badge"), Chip=findComp("Chip");
  const I = (p)=><svg viewBox="0 0 24 24" width="100%" height="100%" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">{p}</svg>;
  const Share=<I><path d="M12 3v13M12 3l-4 4M12 3l4 4"/><path d="M5 13v6a2 2 0 002 2h10a2 2 0 002-2v-6"/></I>;
  const Send=<I><path d="M12 19V5M5 12l7-7 7 7"/></I>;
  const Plus=<I><path d="M12 5v14M5 12h14"/></I>;
  const Dots=<I><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></I>;
  const Check=<I><path d="M20 6L9 17l-5-5"/></I>;
  const Pin=<I><path d="M12 21s7-6.2 7-11a7 7 0 10-14 0c0 4.8 7 11 7 11z"/><circle cx="12" cy="10" r="2.5"/></I>;
  function App(){return (
    <div>
      <div className="grp"><span className="lbl">Buttons</span>
        <Button variant="primary" icon={Share}>Share inventory</Button>
        <Button variant="shimmer">Get a Move Estimate</Button>
        <Button variant="secondary">Estimate weights</Button>
        <Button variant="ghost">Add a room</Button>
        <Button variant="danger">Delete</Button>
        <Button variant="primary" disabled>Disabled</Button>
      </div>
      <div className="grp"><span className="lbl">Sizes</span>
        <Button size="sm" variant="primary">Small</Button>
        <Button size="md" variant="primary">Medium</Button>
        <Button size="lg" variant="primary" icon={Send}>Large</Button>
      </div>
      <div className="grp"><span className="lbl">Icon buttons</span>
        <IconButton tone="accent" aria-label="Send">{Send}</IconButton>
        <IconButton tone="default" aria-label="Add">{Plus}</IconButton>
        <IconButton tone="quiet" aria-label="Menu">{Dots}</IconButton>
        <IconButton tone="plain" aria-label="More">{Dots}</IconButton>
      </div>
      <div className="grp"><span className="lbl">Badges & chips</span>
        <Badge tone="success" icon={Check}>8 added</Badge>
        <Badge tone="accent">281 this week</Badge>
        <Badge tone="beacon">Fragile</Badge>
        <Badge tone="warning">Needs photo</Badge>
        <Chip selected icon={Pin}>Hallway</Chip>
        <Chip icon={Pin}>Storage</Chip>
        <Chip onRemove={()=>{}}>Kitchen</Chip>
      </div>
    </div>
  );}
  ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
<script>(function(){var c=document.getElementById("src").textContent;(0,eval)(Babel.transform(c,{presets:[["react",{runtime:"classic"}]],plugins:[]}).code);})();</script>
</body></html>
