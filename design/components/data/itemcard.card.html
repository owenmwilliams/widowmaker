<!-- @dsCard group="Components" viewport="700x160" name="Data — verified item cards" subtitle="Proof-of-inventory chips" -->
<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body{margin:0;background:var(--l-bg);font-family:var(--font-ui);padding:24px;display:flex;gap:16px;flex-wrap:wrap;align-items:center}
</style>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="../../_ds_bundle.js"></script>
</head><body data-theme="light">
<div id="root"></div>
<script type="text/plain" id="src">
  function findComp(name){ if(typeof window[name]==="function")return window[name];
    for(const k in window){try{const v=window[k];if(v&&typeof v==="object"&&v[name])return v[name];}catch(e){}} return null; }
  const ItemCard=findComp("ItemCard");
  const I=(p)=><svg viewBox="0 0 24 24" width="100%" height="100%" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">{p}</svg>;
  const Box=<I><path d="M21 8l-9-5-9 5 9 5 9-5zM3 8v8l9 5 9-5V8"/></I>;
  const Lamp=<I><path d="M9 3h6l2 6H7zM12 9v9M8 21h8"/></I>;
  const Chair=<I><path d="M6 3v9h12V3M6 12l-1 9M18 12l1 9M5 16h14"/></I>;
  function App(){return (
    <>
      <ItemCard icon={Box} name="Box" meta="44 lb"/>
      <ItemCard icon={Lamp} name="Lamp" meta="7 lb"/>
      <ItemCard icon={Chair} name="Chair" meta="15 lb"/>
    </>
  );}
  ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
<script>(function(){var c=document.getElementById("src").textContent;(0,eval)(Babel.transform(c,{presets:[["react",{runtime:"classic"}]],plugins:[]}).code);})();</script>
</body></html>
