<!-- @dsCard group="Components" viewport="700x200" name="Data — stat cards" subtitle="Dashboard metrics" -->
<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body{margin:0;background:var(--l-bg);font-family:var(--font-ui);padding:22px}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
</style>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="../../_ds_bundle.js"></script>
</head><body data-theme="light">
<div id="root"></div>
<script type="text/plain" id="src">
  function findComp(name){ if(typeof window[name]==="function")return window[name];
    for(const k in window){try{const v=window[k];if(v&&typeof v==="object"&&v[name])return v[name];}catch(e){}} return null; }
  const StatCard=findComp("StatCard");
  const I=(p)=><svg viewBox="0 0 24 24" width="100%" height="100%" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">{p}</svg>;
  const Box=<I><path d="M21 8l-9-5-9 5 9 5 9-5zM3 8v8l9 5 9-5V8"/></I>;
  const Scale=<I><path d="M12 3v18M5 21h14M6 7h12l3 7a4 4 0 01-8 0M6 7L3 14a4 4 0 008 0"/></I>;
  const Cube=<I><path d="M21 8l-9-5-9 5 9 5 9-5zM3 8v8l9 5 9-5V8M12 13v8"/></I>;
  const Alert=<I><path d="M10.3 3.9L1.8 18a2 2 0 001.7 3h17a2 2 0 001.7-3L13.7 3.9a2 2 0 00-3.4 0z"/><path d="M12 9v4M12 17h.01"/></I>;
  function App(){return (
    <div className="grid">
      <StatCard icon={Box} value="281" label="Items" sublabel="Total inventory items"/>
      <StatCard icon={Scale} value="6,098 lbs" label="Total Weight" sublabel="281/281 tracked" tone="cyan"/>
      <StatCard icon={Cube} value="1,312 cu ft" label="Total Volume" sublabel="281/281 tracked" tone="accent"/>
      <StatCard icon={Alert} value="99" label="Fragile Items" sublabel="Handle with care" tone="warning"/>
    </div>
  );}
  ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
<script>(function(){var c=document.getElementById("src").textContent;(0,eval)(Babel.transform(c,{presets:[["react",{runtime:"classic"}]],plugins:[]}).code);})();</script>
</body></html>
