<!-- @dsCard group="Colors" viewport="700x150" name="Beacon & Navy" subtitle="Warm 'almost home' spark + deep ink." -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--bg);font-family:var(--font-ui);padding:20px}
  .row{display:flex;gap:10px}
  .sw{flex:1;height:100px;border-radius:var(--r-md);display:flex;flex-direction:column;justify-content:flex-end;padding:9px 11px;box-sizing:border-box}
  .n{font-family:var(--font-mono);font-size:11px;font-weight:600}
  .h{font-family:var(--font-mono);font-size:10px;opacity:.85}
  .dk{color:#fff}.wm{color:#3a2a10}
  .beaconwrap{flex:1.1;border-radius:var(--r-md);background:var(--navy-800);display:flex;align-items:center;justify-content:center;position:relative}
  .dot{width:26px;height:26px;border-radius:50%;background:var(--beacon-500);box-shadow:var(--glow-beacon)}
</style></head><body>
<div class="row">
  <div class="beaconwrap"><div class="dot"></div></div>
  <div class="sw" style="background:var(--beacon-400)"><span class="n wm">beacon-400</span><span class="h wm">#FBA575</span></div>
  <div class="sw" style="background:var(--beacon-500)"><span class="n wm">beacon-500</span><span class="h wm">#F98D5B</span></div>
  <div class="sw" style="background:var(--beacon-600)"><span class="n dk">beacon-600</span><span class="h dk">#EC7440</span></div>
  <div class="sw" style="background:var(--navy-700)"><span class="n dk">navy-700</span><span class="h dk">#152A5E</span></div>
  <div class="sw" style="background:var(--navy-900)"><span class="n dk">navy-900</span><span class="h dk">#0B1533</span></div>
</div>
</body></html>
