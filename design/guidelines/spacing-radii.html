<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--bg);font-family:var(--font-mono);padding:20px 24px;color:var(--text-primary);display:flex;gap:16px;align-items:center}
  .col{display:flex;flex-direction:column;align-items:center;gap:8px}
  .box{width:74px;height:66px;background:var(--surface-card);border:1.5px solid var(--accent)}
  .lab{font-size:10px;color:var(--text-tertiary)}
</style></head><body>
  <div class="col"><div class="box" style="border-radius:var(--r-sm)"></div><span class="lab">sm 10</span></div>
  <div class="col"><div class="box" style="border-radius:var(--r-md)"></div><span class="lab">md 14 · btn</span></div>
  <div class="col"><div class="box" style="border-radius:var(--r-lg)"></div><span class="lab">lg 18 · card</span></div>
  <div class="col"><div class="box" style="border-radius:var(--r-xl)"></div><span class="lab">xl 22 · bubble</span></div>
  <div class="col"><div class="box" style="border-radius:var(--r-2xl)"></div><span class="lab">2xl 28 · sheet</span></div>
  <div class="col"><div class="box" style="border-radius:var(--r-pill)"></div><span class="lab">pill</span></div>
</body></html>
