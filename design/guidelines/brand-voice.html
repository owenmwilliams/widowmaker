<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--bg);font-family:var(--font-ui);padding:20px 24px;color:var(--text-primary);display:flex;flex-direction:column;gap:10px}
  .do,.dont{display:flex;gap:10px;align-items:flex-start;font-size:14px;line-height:1.4}
  .tag{font-family:var(--font-mono);font-size:11px;font-weight:700;padding:2px 8px;border-radius:var(--r-pill);flex:none;margin-top:1px}
  .do .tag{background:var(--success-quiet);color:var(--success)}
  .dont .tag{background:var(--danger-quiet);color:var(--danger)}
  .dont span:last-child{color:var(--text-secondary);text-decoration:line-through;text-decoration-color:var(--text-tertiary)}
</style></head><body>
  <div class="do"><span class="tag">DO</span><span>"You're doing great! To sharpen the movers' estimate, we still need photos of 2 large items."</span></div>
  <div class="do"><span class="tag">DO</span><span>"Added 8 of the 10 items from the scan." — concrete, honest numbers.</span></div>
  <div class="dont"><span class="tag">NO</span><span>"Error: inventory incomplete. Upload required. ⚠️📦"</span></div>
</body></html>
