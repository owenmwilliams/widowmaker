<!-- @dsCard group="Colors" viewport="700x150" name="Primary — Nexus Blue" subtitle="The single action color. 500 is default." -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--bg);font-family:var(--font-ui);padding:20px}
  .row{display:flex;gap:0;border-radius:var(--r-md);overflow:hidden}
  .sw{flex:1;height:96px;display:flex;flex-direction:column;justify-content:flex-end;padding:8px 10px;box-sizing:border-box}
  .n{font-family:var(--font-mono);font-size:11px;font-weight:600}
  .h{font-family:var(--font-mono);font-size:10px;opacity:.8}
  .lt{color:#16204A}.dk{color:#fff}
  .star{position:absolute;top:6px;right:8px;font-size:11px}
</style></head><body>
<div class="row">
  <div class="sw" style="background:var(--blue-50)"><span class="n lt">50</span><span class="h lt">#EEF2FF</span></div>
  <div class="sw" style="background:var(--blue-100)"><span class="n lt">100</span><span class="h lt">#DEE6FF</span></div>
  <div class="sw" style="background:var(--blue-200)"><span class="n lt">200</span><span class="h lt">#C0CCFF</span></div>
  <div class="sw" style="background:var(--blue-300)"><span class="n lt">300</span><span class="h lt">#97A9FB</span></div>
  <div class="sw" style="background:var(--blue-400)"><span class="n dk">400</span><span class="h dk">#6E82F4</span></div>
  <div class="sw" style="background:var(--blue-500);position:relative"><span class="star">★</span><span class="n dk">500</span><span class="h dk">#4F5BF0</span></div>
  <div class="sw" style="background:var(--blue-600)"><span class="n dk">600</span><span class="h dk">#3D45D9</span></div>
  <div class="sw" style="background:var(--blue-700)"><span class="n dk">700</span><span class="h dk">#2F35B4</span></div>
  <div class="sw" style="background:var(--blue-800)"><span class="n dk">800</span><span class="h dk">#232A82</span></div>
  <div class="sw" style="background:var(--blue-900)"><span class="n dk">900</span><span class="h dk">#172058</span></div>
</div>
</body></html>
